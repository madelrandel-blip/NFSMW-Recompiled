# ============================================================================
#  NFSMW Recomp - codegen overrides for the USA (NTSC) version
#
#  Included from nfsmw_manifest.toml via includes = ["overrides_usa.toml"].
#  Included files use the FLAT schema (sections at the root).
#
#  Based on overrides.toml (PAL Spain). The addresses in THAT file are from
#  the PAL version and do NOT work here: in the USA XEX (entry point
#  0x8262E768) declaring a wrong address splits healthy functions and the
#  runtime blows up in strange ways (see the note on 0x8262E768 in
#  overrides.toml).
#
#  Method: INDIRECT call targets are not seen by static analysis. They appear
#  at runtime, one by one, in the log:
#     [FATAL] Call to invalid or unregistered function at guest address 0x...
#  Every address that appears is added to [functions] and it is recompiled.
# ============================================================================

# Valid address range: 0x82000000 - 0x82CD0000
# (image base 0x82000000 + 13,434,880 bytes of image)

# Performance option validated on PAL; it does not depend on the region.
cr_as_local = true

[functions]

# First USA codegen pass (2026-10-03): 2 UnresolvedCall and 2 unresolved
# conditional branches. They are the same structural problems the PAL XEX
# solved in overrides.toml, with shifted addresses:
#
#   PAL 0x8285CE80 (tail calls from 0x8286931C and 0x82866664)
#   USA 0x8285CC90 (tail calls from 0x8286912C and 0x82866474)   delta -0x1F0
"0x8285CC90" = { }

#   PAL 0x824EDEB0 (gap after sub_824EDE88; branches to 0x824EDED4/0x824EDECC)
#   USA 0x824EDCF8 (branches to 0x824EDD1C from 0x824EDCF8 and to 0x824EDD14
#       from 0x824EDD08)                                        delta -0x1B8
# Declaring the start makes Discover claim the block and the branches become
# internal.
"0x824EDCF8" = { }

#   PAL 0x8285CB90 (indirect target, thunk area 0x8285xxxx-0x8286xxxx)
#   USA 0x8285C9A0 (confirmed: [FATAL] ... at guest address 0x8285C9A0)
"0x8285C9A0" = { }

#   PAL 0x823EB808 (prologue cinematic; on PAL it came out with the Debug build)
#   USA 0x823EB6A0 (confirmed: [FATAL] ... at guest address 0x823EB6A0)
#   delta -0x168 in this area, NOT the -0x1F0 of the thunks.
"0x823EB6A0" = { }

# The same gap (0x823EB688, 56 bytes) has MORE entries: the game already
# crashed at 0x823EB690. It is the identical case to the PAL gap at
# 0x823EB7F0, which had to be subdivided into 8-byte chunks (its note
# documents it):
#   0x823EB7F0 -> USA 0x823EB688 (already listed as a gap)
#   0x823EB7F8 -> USA 0x823EB690   <- confirmed by crash
#   0x823EB800 -> USA 0x823EB698
#   0x823EB808 -> USA 0x823EB6A0   <- confirmed by crash
#   0x823EB810 -> USA 0x823EB6A8
#   0x823EB818 -> USA 0x823EB6B0
#   0x823EB820 -> USA 0x823EB6B8
"0x823EB690" = { }
"0x823EB698" = { }
"0x823EB6A8" = { }
"0x823EB6B0" = { }
"0x823EB6B8" = { }

