# ============================================================================
#  NFSMW Recomp - manual declarations for codegen
#
#  Included from nfsmw_manifest.toml via includes = ["overrides.toml"].
#  Included files use the FLAT schema (sections at the root), not the one
#  nested under [entrypoint] in the manifest.
#
#  Valid address range: 0x82000000 - 0x82CD0000
#  (image base 0x82000000 + 13,434,880 bytes of image)
# ============================================================================

# ----------------------------------------------------------------------------
#  HAND-DECLARED FUNCTIONS
#
#  Key = start address (hex, in quotes).
#  Fields, all optional:
#    name             symbol name (default: sub_XXXXXXXX)
#    size             size in bytes          \ mutually exclusive
#    end              end address            /
#    parent           address of the parent function (discontiguous fragment)
#    share_registers  the fragment shares the parent's registers
#
#  Without size or end, the analyzer discovers the boundaries by itself from
#  the address. That is what we want when all that has to be said is "a
#  function starts here".
# ----------------------------------------------------------------------------
# --- PERFORMANCE: root keys (tools/rendimiento.py) ---
#
# THIS GOES UP HERE ON PURPOSE. In TOML a loose key belongs to the last table
# opened, and [functions] is opened further down. Written at the end of the
# file, cr_as_local would fall inside [functions], the codegen would not read
# it and would say nothing: an hour of compilation for zero changes.
#
# Written and deleted by tools/rendimiento.py. Do not edit by hand.

# Condition registers as local variables instead of context fields, so the
# compiler keeps them in real registers.
cr_as_local = true

# xer_as_local and ctr_as_local WERE TRIED AND REVERTED (2026-09-17).
#
# With both active the game hung deterministically, always at the same point:
# right when the guest threads that load the first track (L2RA_Sunset) start
# in a batch, with exit code -1073741681 (0xC0000135) and not a single
# [error]/[fatal] before it in the log -exactly the pattern of an indirect
# jump (bctr) landing at a garbage address, not that of a missing DLL-.
# Reproduced identically on two different machines.
#
# SUSPICION: ctr_as_local turns CTR from a per-thread context field into a
# local variable of each generated function. bctr/bctrl -indirect jumps,
# switch tables, vtables- READ that CTR to decide where to jump. If some
# generated code expects CTR to survive between calls to other recompiled
# functions -or across a setjmp/longjmp boundary, which this project DOES use
# (see setjmp/longjmp below)-, the local version gets out of sync with the
# real value and the indirect jump lands anywhere. xer_as_local was reverted
# at the same time out of caution, not because there is evidence against it
# specifically: there was no time to isolate which of the two was to blame on
# its own.
#
# Do NOT re-enable without, first: (a) testing them separately -first xer
# alone, rebuild, play a long session; then ctr alone- and (b) checking
# whether the ReXGlue codegen writes CTR back to the context before every
# call/jump between functions when ctr_as_local is active. If it does not, it
# is a codegen bug and not something that can be fixed from here.
# xer_as_local = true
# ctr_as_local = true

# --- end PERFORMANCE root ---

[functions]

# Two tail calls (b, unconditional jump) point here from 0x8286931C and
# 0x82866664, but automatic discovery never created a function at this
# address. Result: the Validate phase fails with
#   UnresolvedCall: 0x8285CE80 - target not in any function
# Declaring it as an entry point is enough; Discover deduces the boundaries.
"0x8285CE80" = { }

# 104-byte gap after the end of sub_824EDE88 (which ends at 0x824EDEA8) and
# before the next function at 0x824EDF10. There is real code inside: the
# Write phase warned about two unresolved conditional branches,
#   0x824EDEB0 -> 0x824EDED4   and   0x824EDEC0 -> 0x824EDECC
# because the source was in no man's land. By declaring the start, Discover
# claims the whole block and the branches become internal.
"0x824EDEB0" = { }

# THE ONE THAT BROKE STARTUP:
#   [FATAL] Call to invalid or unregistered function at guest address 0x826BE258
# sub_826BE1B0 is memcpy (byte-by-byte loop + word fast path) and ends right
# at 0x826BE258. Between that end and the next function, at 0x826BE260, there
# are 8 unreclaimed bytes that someone calls INDIRECTLY -which is why the
# Validate phase did not complain: it only checks direct b/bl jumps-.
"0x826BE258" = { }

# Same pattern, next crash:
#   [FATAL] Call to invalid or unregistered function at guest address 0x8215FEA8
# 8-byte gap between the end of sub_8215FE90 and the function at 0x8215FEB0,
# in an area full of 8- and 16-byte functions (thunk table).
"0x8215FEA8" = { }

# The only address that showed up in the full survey (REXGLUE_SURVEY=1), with
# the game already running its main loop and feeding audio. That is: with this
# one, no known unresolved indirect call remains.
"0x8285CB90" = { }

# It showed up already WITH graphics, on the loading screen. The previous
# survey did not see it because, with the state corrupted by the omitted
# functions, the game never got that far. Every time the game reaches new code
# more can appear: they are indirect call targets, invisible to static
# analysis.
"0x8220C090" = { }

# In the same neighborhood as 0x8285CE80, whose callers were at 0x8286931C
# and 0x82866664. The whole 0x8285xxxx-0x8286xxxx area looks like a thunk table.
"0x82869668" = { }

# 0x8262E768 - RETIRED. Do not declare. The full explanation, because the
# error will show up again if someone tests the build with another ISO:
#
#   [error] XThread::Execute - No function registered at 8262E768
#
# That message did NOT mean a function was missing. 0x8262E768 was the
# EXECUTABLE ENTRY POINT of a version of the game DIFFERENT from ours.
# The runtime reads that address from the XEX header inside the ISO, so each
# region has its own. In our XEX the entry is at 0x8262E960; that of the
# friend who reported the crash, at 0x8262E768.
#
# Declaring it here did two kinds of damage:
#   1. It turned a message that pointed at the real problem -wrong ISO- into a
#      silent crash from reading address 0.
#   2. It split the function 0x8262E708..0x8262E7B0 in two, which is a healthy
#      function of OUR build. That is where the codegen warning
#      "Unresolved conditional branch to 0x8262E728 from 0x8262E7A4" came
#      from.
#
# HOW TO RECOGNIZE IT AGAIN: if "No function registered at X" comes out with
# X = the start_address of the MAIN thread, it is not a missing function. It
# is that the ISO is not the version it was compiled against. Comparing that
# address with the entry of our XEX solves it in a minute.

# In-game prologue cinematic:
#   [FATAL] Call to invalid or unregistered function at guest address 0x8212F670
# Another indirect call target, invisible to static analysis. It appeared only
# when the floating-point fix let the game get this far: every new stretch the
# game reaches can expose more.
"0x8212F670" = { }

# They keep appearing in the same prologue cinematic, one per run.
# It is the usual pattern: indirect call targets invisible to static analysis,
# which only come to light when the game walks that path.
# 0x824B1640 came out with the Release build, 0x823EB808 with the Debug one:
# they are different paths of the same stretch, not a difference between
# builds.
"0x824B1640" = { }
"0x823EB808" = { }

# ----------------------------------------------------------------------------
#  JUMP TABLES
#
#    address   address of the dispatching bctr instruction
#    register  GPR number holding the index
#    labels    targets IN INDEX ORDER (labels[0] = index 0)
#
#  Getting the order wrong does not produce a compilation error: it produces
#  random crashes.
# ----------------------------------------------------------------------------
# [[switch_tables]]
# address  = 0x82000000
# register = 11
# labels   = [0x82000000, 0x82000000]

# ----------------------------------------------------------------------------
#  DATA REGIONS IN .text
#    data  32-bit pattern to mark as "not code"
#    size  bytes of the region starting at each instance of the pattern
# ----------------------------------------------------------------------------
# [[invalid_instructions]]
# data = 0x00000000
# size = 16

# ----------------------------------------------------------------------------
#  MID-ASM HOOKS
#  Intercept a specific instruction without rewriting the function. It is the
#  tool for patches (disc check, framerate, resolution) without touching the
#  original binary.
#
#    address            PPC instruction to hook
#    name               C++ function to call
#    registers          list of registers passed as PPCRegister&
#    after_instruction  false = before executing it; true = after
#    return / jump_address                    unconditional flow control
#    return_on_true / return_on_false         depending on what the hook returns
#    jump_address_on_true / _on_false
# ----------------------------------------------------------------------------
# [[midasm_hook]]
# address        = 0x82000000
# name           = "MyHook"
# registers      = ["r3"]
# return_on_true = true

# ----------------------------------------------------------------------------
#  INDIRECT CALL HINTS
#  Addresses we know are the target of an indirect call and that the analysis
#  did not deduce. (Not documented in the wiki.)
# ----------------------------------------------------------------------------
# indirect_calls = [0x82000000]

# ----------------------------------------------------------------------------
#  setjmp / longjmp
#  Without this, non-local jumps corrupt the thread context and the crash
#  appears very far from the cause. Locate them in the disassembly:
#    setjmp  saves r14-r31 + LR + CR + SP into the buffer at r3 and returns 0
#    longjmp restores that buffer and ends in mtctr/bctr
# ----------------------------------------------------------------------------
# setjmp_address  = 0x82000000
# longjmp_address = 0x82000000

# ----------------------------------------------------------------------------
#  GENERATED CODE QUALITY
#  All start at false. Enable them ONLY once the game already starts: they
#  change the codegen and can mask real runtime bugs.
#  Suggested order: cr_as_local (the one that pays off most in code with many
#  branches), then xer, ctr, non_volatile, skip_lr.
# ----------------------------------------------------------------------------
# skip_lr                      = false
# skip_msr                     = false
# ctr_as_local                 = false
# xer_as_local                 = false
# cr_as_local                  = false
# reserved_as_local            = false
# non_argument_as_local        = false
# non_volatile_as_local        = false
# generate_exception_handlers  = false   # note: the wiki calls it enable_*, it is generate_*

# ----------------------------------------------------------------------------
#  ANALYSIS TUNING
# ----------------------------------------------------------------------------
# [analysis]
# max_jump_extension       = 65536
# data_region_threshold    = 16       # lower to 8 if there are many false "invalid instruction"
# large_function_threshold = 1048576
# exception_handler_funcs  = []

# ----------------------------------------------------------------------------
#  ReXCRT - map guest CRT functions to native implementations.
#  Big gain: instead of executing the recompiled memcpy instruction by
#  instruction, the host one is called. The heap group is all-or-nothing.
# ----------------------------------------------------------------------------
# FINDING: the game's memcpy identified at 0x826BE1B0 (by reading the generated
# C++: byte-by-byte loop, word fast path, unaligned handling, r3 intact as the
# return value). Mapping it here replaces the recompiled loop with the host
# memcpy: a big gain, because memcpy is one of the hottest paths in any game.
# Do NOT enable it yet. First make it start; one variable at a time.
# [rexcrt]
# memcpy = 0x826BE1B0
#
# [rexcrt]
# RtlAllocateHeap   = 0x82000000
# RtlFreeHeap       = 0x82000000
# RtlSizeHeap       = 0x82000000
# RtlReAllocateHeap = 0x82000000
# memcpy            = 0x82000000
# memset            = 0x82000000

# --- PERFORMANCE: rexcrt (tools/rendimiento.py) ---
#
# The game's memcpy, replaced by the host one.
# sub_826BE1B0 identified by reading the generated C++: it copies only
# forward, with no overlap detection, r3 intact as the return. It is memcpy,
# not memmove, so std::memcpy is equivalent.
#
# Written and deleted by tools/rendimiento.py. Do not edit by hand.

[rexcrt]
memcpy = 0x826BE1B0

# --- end PERFORMANCE rexcrt ---
