# ============================================================================
#  NFSMW Recomp - executable configuration
#
#  The game reads this file on startup, from ITS OWN FOLDER:
#      <folder of the .exe>\nfsmw.toml
#
#  The name is not the executable's, it is the app's -"nfsmw"- so it works the
#  same next to NFS_Most_Wanted.exe as next to nfsmw.exe.
#
#  Command-line arguments TAKE PRECEDENCE over what is here, so things can
#  still be tried with PROBAR_RTV.bat without touching the file.
# ============================================================================


# ----------------------------------------------------------------------------
#  EDRAM emulation path
# ----------------------------------------------------------------------------
#
#  WHAT IT IS
#  The Xbox 360 has no normal render targets: it has 10 MB of embedded memory
#  -the EDRAM- where fixed-function hardware does the blending and depth test.
#  Emulating that can be done in two ways:
#
#    "rtv"  host render targets, using the GPU normally. Fast.
#    "rov"  the EDRAM is emulated by hand inside the pixel shader, with
#           interlocks that force overlapping pixels to be processed IN ORDER.
#           It is more accurate and MUCH slower.
#
#  WHY IT IS SET BY HAND
#  Because the SDK did not choose by performance but by VENDOR
#  -src/graphics/d3d12/render_target_cache.cpp-:
#
#      path_ = vendor == kIntel ? kPixelShaderInterlock : kHostRenderTargets;
#
#  If the graphics card was Intel, ROV forced. The reason is dated in the SDK's
#  own comment: an April 2021 Intel driver bug -a UHD 630- where the "always"
#  stencil comparison did not work. And on top of that the comment next to it
#  says "The ROV path is currently much slower generally".
#
#  MEASURED IN THIS PROJECT, on an Intel Iris 540, same spot, without vsync:
#      rov (what the SDK forced)      ~10 fps
#      rtv (this)                     ~18 fps
#
#  And with no visible glitches, meaning the 2021 bug is no longer in the
#  driver.
#
#  On NVIDIA and AMD "rtv" was already the default, so setting it here changes
#  nothing for them. All this line does is remove a decision made by graphics
#  card brand.
#
#  IF IT EVER LOOKS WRONG -ghosting, things that do not clear, remnants of the
#  previous frame- try "rov" and compare.
render_target_path_d3d12 = "rtv"


# ----------------------------------------------------------------------------
#  Resolution (equivalent to GoldenEye-Recomp, same ReXGlue SDK)
# ----------------------------------------------------------------------------
#
#  - video_mode_*: sets the GUEST VIDEO MODE (what the game presents), NOT the
#    window. The recomp's default was 854x480 (PAL EDTV) and the engine warns
#    "swap source is unscaled (854x480)" -> that is why it looked blurry even
#    when the scale was high: the frame was stretched from 854x480.
#  - resolution_scale: engine supersampling, same as in GoldenEye:
#    renders/interiors at N times on both axes and scales down to window size.
#    Only integers work (1/2/3/4). It is applied AT STARTUP: the game must be
#    restarted for it to change.
#    With video_mode 1080p:
#      2  = 3840x2160 internal  (4x pixels)      <- recommended
#      3  = 5760x3240 internal  (9x pixels)
#      4  = 7680x4320 internal  (16x pixels)
#  - anisotropic_override: 0=off, 3=4x, 4=8x, 5=16x (applies without restart).
#  - swap_post_effect: "none" | "fxaa" | "fxaa_extreme" (engine post AA).
#  - user_profile_name: gamertag of the simulated Xbox Live profile (editable
#    from the ESC menu, OTHER tab).
#
#  The launcher's arguments take precedence over this: to test this file, run
#  nfsmw.exe directly (or a .bat) without passing --resolution/--escala.
video_mode_width  = 1920
video_mode_height = 1080
resolution_scale  = 2
anisotropic_override = 5

# ----------------------------------------------------------------------------
#  Audio
# ----------------------------------------------------------------------------
#
#  audio_maxqframes: queued audio frames (1 frame = 5.33 ms at 48 kHz).
#  The SDK default is 8 (~43 ms). On load spikes the game audio thread starves,
#  SDL feeds silence and the result is crackling. 16 (~85 ms) is what the
#  project's launcher uses; raise to 24-32 if it still crackles.
audio_maxqframes = 16
